; PlatformIO Project Configuration File for Project Dimmo
; -------------------------------------------------------
; Lead Architect: Nariman Ziaie
; B.Sc. Degree Project: IoT-Based Smart Dimmer Ecosystem

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; --- Serial Monitor & Upload Settings (Default USB Serial) ---
monitor_speed = 115200
upload_speed = 921600

; --- Over-The-Air (OTA) Upload Settings (Optional) ---
; To flash via OTA, uncomment the lines below and set your ESP32 IP address:
; upload_protocol = espota
; upload_port = 192.168.1.50
; upload_flags = 
;     --auth=espOTAadmin
;     --port=8266

; --- Build Options & Performance Flags ---
build_flags = 
    -D CORE_DEBUG_LEVEL=3                  ; Info level logging for clean debugging
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192 ; Expand stack size to safely handle heavy MQTT/JSON payloads

; --- Library Dependencies (Strict Version Lock) ---
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
    knolleary/PubSubClient @ 2.8
    arduino-libraries/NTPClient @ 3.2.1
    bblanchon/ArduinoJson @ 7.4.2