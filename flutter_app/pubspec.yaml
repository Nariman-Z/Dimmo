name: dimmo
description: "IoT-Enabled AC Power Regulation with Secure Remote Access"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  clay_containers: ^0.3.4

  # Functionality
  mqtt_client: ^10.11.11
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F2F4F5"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/certificates/
